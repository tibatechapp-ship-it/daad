[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daad"
version = "0.1.0"
description = "ضاد — Arabic Python transpiler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "tibatechapp-ship-it" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
daad = "daad.cli:main"

[project.urls]
Homepage = "https://github.com/tibatechapp-ship-it/daad"

[tool.setuptools.packages.find]
include = ["daad*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
